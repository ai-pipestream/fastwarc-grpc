# CI gates for fastwarc-grpc: the same commands documented in README.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A checksummed release download behaves the same on GitHub and Forgejo.
      - name: Install buf
        env:
          BUF_VERSION: 1.71.0
        run: |
          base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
          bin="buf-Linux-$(uname -m)"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$bin"
          curl -sSfL "$base/sha256.txt" | grep " $bin\$" | sha256sum -c -
          install -m 0755 "$bin" /usr/local/bin/buf
          buf --version
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf format
        working-directory: proto
        run: buf format --diff --exit-code
      # The contract is owned upstream; breaking-change review happens there.
      # What this repo guarantees is that its copy is the pinned crate's.
      - name: proto matches the pinned crate
        run: scripts/check-proto-pin.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Install grpcurl
        env:
          GRPCURL_VERSION: 1.9.3
        run: |
          base="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}"
          archive="grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/grpcurl_${GRPCURL_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" grpcurl
          install -m 0755 grpcurl /usr/local/bin/grpcurl
      - name: Build the image
        run: docker build -t fastwarc-grpc:ci .
      - name: Smoke test
        run: |
          docker run -d --name fastwarc --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 50060:50060 fastwarc-grpc:ci
          for _ in $(seq 1 30); do
            grpcurl -plaintext localhost:50060 list >/dev/null 2>&1 && break
            sleep 1
          done
          scripts/smoke.sh localhost:50060
      - name: Server log
        if: always()
        run: docker logs fastwarc || true
